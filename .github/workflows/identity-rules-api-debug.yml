name: Diagnose Identity Rules Lite API gate

on:
  push:
    branches:
      - feature/identity-rules-authorization
    paths:
      - .github/identity-rules-api-debug.ready

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Reconstruct and apply reviewed source patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .github/identity-rules-patch/part-* > "$RUNNER_TEMP/identity-rules-source.patch.gz.b64"
          echo 'b8ab337f63159c47ecd6291efa2b58d1965e49b143bdfdbee2f0a2c038e1010b  '"$RUNNER_TEMP/identity-rules-source.patch.gz.b64" | sha256sum -c -
          base64 --decode "$RUNNER_TEMP/identity-rules-source.patch.gz.b64" > "$RUNNER_TEMP/identity-rules-source.patch.gz"
          echo '63b87fe946693f0e23d5c31ee972628fb756fbd297e54b482a0030f46b4846d7  '"$RUNNER_TEMP/identity-rules-source.patch.gz" | sha256sum -c -
          gzip --decompress --stdout "$RUNNER_TEMP/identity-rules-source.patch.gz" > "$RUNNER_TEMP/identity-rules-source.patch"
          echo '51122576b9efb7908404d8cacd360b456d295164c66cf65b496db3ece4e1e690  '"$RUNNER_TEMP/identity-rules-source.patch" | sha256sum -c -
          git apply --check --whitespace=error "$RUNNER_TEMP/identity-rules-source.patch"
          git apply "$RUNNER_TEMP/identity-rules-source.patch"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-ci-openapi-constraints.txt
            pocket-lab-final-structure/runtime/requirements.txt

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: '3.50.0'
          repo-token: ${{ github.token }}

      - name: Install backend dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install \
            --upgrade-strategy only-if-needed \
            --constraint requirements-ci-openapi-constraints.txt \
            -r requirements-dev.txt \
            -r pocket-lab-final-structure/runtime/requirements.txt

      - name: Run Lite API gate with bounded failure annotation
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG="$RUNNER_TEMP/lite-api-check.log"
          if task lite:api:check >"$LOG" 2>&1; then
            tail -n 20 "$LOG"
            exit 0
          fi
          tail -n 80 "$LOG"
          python - "$LOG" <<'PY'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors='replace')[-12000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error file=scripts/dev/check-lite-api.sh,title=lite api check failed::{text}')
          PY
          exit 1
