name: Temporary Photo Backup Qualification

on:
  push:
    branches:
      - feat/photoprism-webdav-photo-backup

permissions:
  contents: read

concurrency:
  group: temporary-photo-backup-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
      SOURCE_COMMIT: ${{ github.sha }}
      PYTHONPATH: tests:pocket-lab-final-structure/runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Record deterministic generation timestamp
        run: echo "SOURCE_GENERATED_AT=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.16.0'
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-docs.txt
            requirements-ci-openapi-constraints.txt
            pocket-lab-final-structure/runtime/requirements.txt

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: '3.50.0'
          repo-token: ${{ github.token }}

      - name: Install development dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install             --upgrade-strategy only-if-needed             --constraint requirements-ci-openapi-constraints.txt             -r requirements-dev.txt             -r pocket-lab-final-structure/runtime/requirements.txt
          npm ci
          npx playwright install --with-deps chromium

      - name: Static syntax and branch diff
        run: |
          .venv/bin/python -m py_compile             pocket-lab-final-structure/runtime/api_fastapi/services/lite_photo_backup.py             pocket-lab-final-structure/runtime/api_fastapi/routers/fleet.py             pocket-lab-final-structure/runtime/api_fastapi/services/domain_commands.py             pocket-lab-final-structure/runtime/api_fastapi/services/workload_admission.py             pocket-lab-final-structure/runtime/workers/pocketlab_worker.py             pocket-lab-final-structure/runtime/agents/lite_photo_backup_agent.py             pocket-lab-final-structure/runtime/agents/pocketlab_node_agent.py
          bash -n             pocket-lab-final-structure/pocket-lab-bootstrap-production-scripts-patched/scripts/install-termux-packages.sh             pocket-lab-final-structure/pocket-lab-bootstrap-production-scripts-patched/scripts/lite/ensure-fleet-media-tools.sh
          git diff --check origin/main...HEAD

      - name: Focused backend and regression suites
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          .venv/bin/python -m pytest -q             tests/backend/test_lite_photo_backup.py             tests/backend/test_lite_photo_backup_agent.py             tests/backend/test_lite_api.py             tests/backend/test_lite_device_facts.py

      - name: Production PWA build
        run: npm run build

      - name: Photo backup mocked browser qualification
        env:
          VITE_POCKETLAB_MOCKS: '1'
          LITE_E2E_MODE: mocked
        run: |
          npx playwright test tests/e2e/lite-photo-backup.spec.ts             --project=mocked-desktop             --project=mocked-mobile

      - name: Lite API compatibility gate
        run: task lite:api:check

      - name: Full Lite gate
        run: task lite:check
