name: Diagnose Identity Rules documentation intelligence

on:
  push:
    branches:
      - feature/identity-rules-authorization
    paths:
      - .github/identity-rules-docs-debug.ready

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Reconstruct implementation and documentation order fix
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .github/identity-rules-patch/part-* > "$RUNNER_TEMP/identity-rules-source.patch.gz.b64"
          echo 'b8ab337f63159c47ecd6291efa2b58d1965e49b143bdfdbee2f0a2c038e1010b  '"$RUNNER_TEMP/identity-rules-source.patch.gz.b64" | sha256sum -c -
          base64 --decode "$RUNNER_TEMP/identity-rules-source.patch.gz.b64" > "$RUNNER_TEMP/identity-rules-source.patch.gz"
          echo '63b87fe946693f0e23d5c31ee972628fb756fbd297e54b482a0030f46b4846d7  '"$RUNNER_TEMP/identity-rules-source.patch.gz" | sha256sum -c -
          gzip --decompress --stdout "$RUNNER_TEMP/identity-rules-source.patch.gz" > "$RUNNER_TEMP/identity-rules-source.patch"
          echo '51122576b9efb7908404d8cacd360b456d295164c66cf65b496db3ece4e1e690  '"$RUNNER_TEMP/identity-rules-source.patch" | sha256sum -c -
          git apply --check --whitespace=error "$RUNNER_TEMP/identity-rules-source.patch"
          git apply "$RUNNER_TEMP/identity-rules-source.patch"
          python3 -c "from pathlib import Path; p=Path('tasks/Taskfile.docs.yml'); s=p.read_text(); old='      - task: lite:docs:health:generate\n      - task: lite:docs:knowledge:generate\n      - task: lite:docs:intelligence:generate\n      - task: lite:docs:enterprise:generate\n      - task: lite:docs:architecture:generate\n'; new='      - task: lite:docs:health:generate\n      - task: lite:docs:architecture:generate\n      - task: lite:docs:knowledge:generate\n      - task: lite:docs:intelligence:generate\n      - task: lite:docs:enterprise:generate\n'; assert old in s; p.write_text(s.replace(old,new,1))"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.4'

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: '3.50.0'
          repo-token: ${{ github.token }}

      - name: Install documentation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install \
            --upgrade-strategy only-if-needed \
            --constraint requirements-ci-openapi-constraints.txt \
            -r requirements-dev.txt \
            -r requirements-docs.txt \
            -r pocket-lab-final-structure/runtime/requirements.txt
          bash scripts/dev/lite/setup-documentation-tools.sh --install-missing
          bash scripts/dev/lite/setup-parity-tools.sh --install-missing

      - name: Generate Documentation Platform
        shell: bash
        run: |
          set -Eeuo pipefail
          task lite:docs:generate

      - name: Diagnose Documentation Intelligence check
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG="$RUNNER_TEMP/documentation-intelligence-check.log"
          if task lite:docs:intelligence:check >"$LOG" 2>&1; then
            tail -n 40 "$LOG"
            exit 0
          fi
          tail -n 160 "$LOG"
          .venv/bin/python - "$LOG" <<'PY'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors='replace')[-12000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error file=scripts/docs/intelligence/generate_documentation_intelligence.py,title=documentation intelligence check failed::{text}')
          PY
          exit 1
