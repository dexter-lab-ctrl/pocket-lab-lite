name: Pocket Lab Lite quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pocket-lab-lite-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-devpc-qualification:
    runs-on: ubuntu-latest
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-ci-openapi-constraints.txt
            pocket-lab-final-structure/runtime/requirements.txt
      - name: Install Lite API runtime dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install \
            --upgrade-strategy only-if-needed \
            --constraint requirements-ci-openapi-constraints.txt \
            -r requirements-dev.txt \
            -r pocket-lab-final-structure/runtime/requirements.txt
      - name: Install and verify pinned disposable NATS server
        run: |
          nats_version='2.10.26'
          nats_archive="nats-server-v${nats_version}-linux-amd64.tar.gz"
          nats_url="https://github.com/nats-io/nats-server/releases/download/v${nats_version}/${nats_archive}"
          mkdir -p "$RUNNER_TEMP/pocketlab-nats"
          curl --fail --silent --show-error --location "$nats_url" --output "$RUNNER_TEMP/pocketlab-nats/$nats_archive"
          printf '%s  %s\n' '6cbac67107e69c9e5a352d6f1555027f9da6a6b3fa81cceafefa9598b4451512' "$RUNNER_TEMP/pocketlab-nats/$nats_archive" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/pocketlab-nats/$nats_archive" -C "$RUNNER_TEMP/pocketlab-nats"
          echo "$RUNNER_TEMP/pocketlab-nats/nats-server-v${nats_version}-linux-amd64" >> "$GITHUB_PATH"
      - name: Run full isolated candidate qualification
        run: task lite:photo-backup:candidate:full CANDIDATE_SHA="$CANDIDATE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: pocket-lab-lite-isolated-qualification
          path: /tmp/pocket-lab-lite-qualification-evidence
          if-no-files-found: warn
          retention-days: 14

  quick-and-docs:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Record deterministic source generation timestamp
        run: echo "SOURCE_GENERATED_AT=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.16.0'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-docs.txt
            requirements-ci-openapi-constraints.txt
            pocket-lab-final-structure/runtime/requirements.txt
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: '3.50.0'
          repo-token: ${{ github.token }}
      - name: Install development and Lite API runtime dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install \
            --upgrade-strategy only-if-needed \
            --constraint requirements-ci-openapi-constraints.txt \
            -r requirements-dev.txt \
            -r pocket-lab-final-structure/runtime/requirements.txt
          npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify qualified Lite API Python toolchain
        run: |
          .venv/bin/python - <<'PY'
          import sys
          from importlib.metadata import version

          packages = [
              "fastapi",
              "starlette",
              "pydantic",
              "pydantic-core",
              "uvicorn",
              "nats-py",
              "PyYAML",
          ]

          print("Python:", sys.version.split()[0])

          for package in packages:
              print(f"{package}: {version(package)}")

          import fastapi
          import pydantic
          import nats
          import yaml

          print("PASS FastAPI/runtime imports are available")
          print("PASS qualified OpenAPI toolchain provenance recorded")
          PY

      - name: Install pinned documentation and parity tools
        run: |
          bash scripts/dev/lite/setup-documentation-tools.sh --install-missing
          bash scripts/dev/lite/setup-parity-tools.sh --install-missing
      - name: Generate and check contracts and docs
        run: |
          task lite:docs:generate
          task lite:docs:check
          task lite:parity:contracts:check
          task lite:parity:backend
          task lite:parity:api
          task lite:parity:selectors
          task lite:evidence:parity:generate
          task lite:evidence:parity:check
      - name: Quick Lite gate and Storybook
        run: |
          task lite:check:quick
          task lite:test:storybook
      - name: Install CI Chromium and run mocked integration
        run: |
          npx playwright install --with-deps chromium
          VITE_POCKETLAB_MOCKS=1 LITE_E2E_MODE=mocked npx playwright test tests/e2e/lite-mocked.spec.ts tests/e2e/lite-parity.spec.ts tests/e2e/lite-accessibility.spec.ts --project=mocked-desktop --project=mocked-mobile
          task lite:test:docs
      - name: Qualify UI performance contract
        # PR #590 explicitly excludes the PR #588/#589 60 FPS qualification.
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.number != 590 }}
        env:
          LITE_PERF_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run test:perf:qualification
      - name: Redaction and evidence
        run: |
          .venv/bin/python scripts/dev/lite/redaction_check.py --paths contracts/generated src/test/fixtures/generated docs/generated .pocketlab-dev/validation .pocketlab-dev/performance
          .venv/bin/python scripts/dev/lite/validation_evidence.py allure --validation-dir .pocketlab-dev/validation --output allure-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: pocket-lab-lite-validation
          path: |
            .pocketlab-dev/validation
            .pocketlab-dev/playwright-report
            .pocketlab-dev/performance
            allure-results
            site
          if-no-files-found: warn
          retention-days: 14
