name: Materialize Identity Rules implementation

on:
  push:
    branches:
      - feature/identity-rules-authorization
    paths:
      - .github/identity-rules-materialize.ready

permissions:
  contents: write

concurrency:
  group: identity-rules-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
      SOURCE_COMMIT: uncommitted
      SOURCE_GENERATED_AT: uncommitted
      BASE_SHA: b931813b9bb1cf146b5b59f31240a50a883ee755
      BRANCH: feature/identity-rules-authorization
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and apply reviewed source patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .github/identity-rules-patch/part-* > "$RUNNER_TEMP/identity-rules-source.patch"
          echo '51122576b9efb7908404d8cacd360b456d295164c66cf65b496db3ece4e1e690  '"$RUNNER_TEMP/identity-rules-source.patch" | sha256sum -c -
          git apply --check --whitespace=error "$RUNNER_TEMP/identity-rules-source.patch"
          git apply "$RUNNER_TEMP/identity-rules-source.patch"
          git rm -r .github/identity-rules-patch .github/identity-rules-materialize.ready .github/workflows/identity-rules-materialize.yml
          git add -A
          git diff --cached --check

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.16.0'
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-docs.txt
            requirements-ci-openapi-constraints.txt
            pocket-lab-final-structure/runtime/requirements.txt

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: '3.50.0'
          repo-token: ${{ github.token }}

      - name: Install qualified development dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install \
            --upgrade-strategy only-if-needed \
            --constraint requirements-ci-openapi-constraints.txt \
            -r requirements-dev.txt \
            -r requirements-docs.txt \
            -r pocket-lab-final-structure/runtime/requirements.txt
          npm ci
          bash scripts/dev/lite/setup-documentation-tools.sh --install-missing
          bash scripts/dev/lite/setup-parity-tools.sh --install-missing

      - name: Install OPA v1.19.0 for policy validation
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 4 --retry-delay 2 \
            -o "$RUNNER_TEMP/opa" \
            https://github.com/open-policy-agent/opa/releases/download/v1.19.0/opa_linux_amd64_static
          echo '1dd5c5591ff856f5e20a1d66bafae9511ddf3c5552ed3b5070c70b2b6580ee3f  '"$RUNNER_TEMP/opa" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/opa"
          sudo install -m 0755 "$RUNNER_TEMP/opa" /usr/local/bin/opa
          opa version
          opa fmt --fail --check-result security/policies/opa/pocketlab/pocketlab.rego security/policies/opa/pocketlab/pocketlab_test.rego
          opa check --strict security/policies/opa/pocketlab
          opa test --fail-on-empty security/policies/opa/pocketlab

      - name: Static and focused Identity Rules validation
        shell: bash
        run: |
          set -Eeuo pipefail
          .venv/bin/python -m py_compile \
            pocket-lab-final-structure/runtime/api_fastapi/deps.py \
            pocket-lab-final-structure/runtime/api_fastapi/main.py \
            pocket-lab-final-structure/runtime/api_fastapi/routers/fleet.py \
            pocket-lab-final-structure/runtime/api_fastapi/routers/lite.py \
            pocket-lab-final-structure/runtime/api_fastapi/services/action_queue.py \
            pocket-lab-final-structure/runtime/api_fastapi/services/domain_commands.py \
            pocket-lab-final-structure/runtime/api_fastapi/services/lite_identity_auth.py \
            pocket-lab-final-structure/runtime/api_fastapi/services/lite_policy_opa.py \
            pocket-lab-final-structure/runtime/core/operations/service.py \
            pocket-lab-final-structure/runtime/supervisors/pocketlab_core_supervisor.py \
            scripts/docs/lite/generate_docs.py \
            scripts/docs/enterprise/enterprise_completion.py \
            scripts/docs/enterprise/threat_model_experience.py \
            scripts/docs/enterprise/threat_model_layout.py \
            scripts/docs/enterprise/threat_model_poster.py \
            tests/backend/test_lite_identity_rules_authorization.py
          bash -n pocket-lab-final-structure/pocket-lab-bootstrap-production-scripts-patched/scripts/install-binaries.sh
          bash -n pocket-lab-final-structure/pocket-lab-bootstrap-production-scripts-patched/scripts/start-dashboard.sh
          bash -n pocket-lab-final-structure/pocket-lab-bootstrap-production-scripts-patched/scripts/lite/prepare-opa-policy.sh
          node --check src/lib/liteApi.js
          node --check src/mocks/handlers.js
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 .venv/bin/python -m pytest -q \
            tests/backend/test_lite_identity_rules_authorization.py \
            tests/backend/test_lite_api.py \
            tests/backend/test_vault_operations.py \
            tests/backend/test_nats_required.py
          task lite:api:check

      - name: Frontend production and mocked browser validation
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run build
          npx playwright install --with-deps chromium
          VITE_POCKETLAB_MOCKS=1 LITE_E2E_MODE=mocked \
            npx playwright test tests/e2e/lite-mocked.spec.ts \
              --project=mocked-desktop --project=mocked-mobile

      - name: Generate and strictly check Documentation Platform
        shell: bash
        run: |
          set -Eeuo pipefail
          task lite:docs:generate
          task lite:docs:check
          git add -A
          git diff --cached --check
          git status --short > "$RUNNER_TEMP/identity-rules-before.txt"
          task lite:docs:generate
          git status --short > "$RUNNER_TEMP/identity-rules-after.txt"
          diff -u "$RUNNER_TEMP/identity-rules-before.txt" "$RUNNER_TEMP/identity-rules-after.txt"
          git add -A
          git diff --cached --check

      - name: Rewrite staging history to one clean implementation commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --soft "$BASE_SHA"
          git commit -m 'feat: integrate Identity and Rules authorization with OPA'
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "final_sha=$FINAL_SHA" >> "$GITHUB_STEP_SUMMARY"
          git push --force-with-lease="refs/heads/$BRANCH:${{ github.sha }}" origin "HEAD:refs/heads/$BRANCH"
