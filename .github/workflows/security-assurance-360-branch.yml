name: Security assurance 360 branch qualification

on:
  push:
    branches:
      - feat/security-assurance-360-runtime-testing

permissions:
  contents: read

concurrency:
  group: security-assurance-360-branch
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 50

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.16.0'
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-docs.txt
            requirements-ci-openapi-constraints.txt
            pocket-lab-final-structure/runtime/requirements.txt

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52
        with:
          version: '3.50.0'
          repo-token: ${{ github.token }}

      - name: Install focused dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install             --upgrade-strategy only-if-needed             --constraint requirements-ci-openapi-constraints.txt             -r requirements-dev.txt             -r pocket-lab-final-structure/runtime/requirements.txt
          npm ci

      - name: Syntax and fixed-adapter checks
        run: |
          .venv/bin/python -m py_compile             scripts/dev/lite/security_assurance_360.py             scripts/dev/lite/security_assurance_runtime_tunnel.py             scripts/dev/lite/security_assurance_toolchain.py             scripts/dev/lite/security_assurance.py             pocket-lab-final-structure/runtime/api_fastapi/services/lite_security_assurance.py
          node --check scripts/dev/lite/security_assurance_browser.mjs
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          git diff --check origin/main...HEAD

      - name: Focused Security Assurance tests
        env:
          PYTHONPATH: tests:pocket-lab-final-structure/runtime
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          .venv/bin/python -m pytest -q             tests/backend/test_lite_security_assurance_360.py             tests/backend/test_lite_security_assurance_toolchain.py             tests/backend/test_lite_security_assurance_scenario_contracts.py             tests/backend/test_lite_security_assurance.py

      - name: Registry and playbook checks
        run: |
          .venv/bin/python scripts/dev/lite/security_assurance.py check
          .venv/bin/python scripts/docs/check_security_assurance_playbooks.py
