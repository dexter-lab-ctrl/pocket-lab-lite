name: Security assurance correlation generation (one shot)

on:
  push:
    branches:
      - feat/security-assurance-model-evidence-correlation

permissions:
  contents: write

concurrency:
  group: security-assurance-correlation-generation
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: feat/security-assurance-model-evidence-correlation
          fetch-depth: 0

      - name: Record deterministic generation timestamp
        run: echo "SOURCE_GENERATED_AT=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.16.0'
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-docs.txt
            requirements-ci-openapi-constraints.txt
            pocket-lab-final-structure/runtime/requirements.txt

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: '3.50.0'
          repo-token: ${{ github.token }}

      - name: Install repository development dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install \
            --upgrade-strategy only-if-needed \
            --constraint requirements-ci-openapi-constraints.txt \
            -r requirements-dev.txt \
            -r requirements-docs.txt \
            -r pocket-lab-final-structure/runtime/requirements.txt
          npm ci
          bash scripts/dev/lite/setup-documentation-tools.sh --install-missing

      - name: Generate canonical report index and documentation once
        run: |
          .venv/bin/python scripts/dev/lite/security_assurance_report.py index
          task lite:docs:generate

      - name: Make new generated paths Git-visible before final Codebase Map pass
        run: |
          for path in \
            contracts/generated/documentation-enterprise/security-assurance-correlation.json \
            docs/generated/enterprise/hubs/security-assurance/model-and-evidence.md \
            docs/generated/enterprise/hubs/security-assurance/scenario-walkthroughs.md \
            docs/generated/enterprise/hubs/security-assurance/stride-evidence.md \
            docs/generated/enterprise/hubs/security-assurance/owasp-evidence.md \
            docs/generated/enterprise/hubs/security-assurance/model-assurance-evidence.md \
            docs/generated/enterprise/hubs/security-assurance/scenario-model.md \
            docs/generated/enterprise/hubs/security-assurance/how-to-read.md \
            docs/generated/enterprise/threat-model/assurance-evidence.md
          do
            test -e "$path" && git add -N -- "$path"
          done
          task lite:docs:generate

      - name: Validate generated correlation and documentation gates
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 .venv/bin/python -m pytest -q \
            tests/docs/test_security_assurance_correlation.py \
            tests/docs/test_documentation_ia.py \
            tests/docs/test_enterprise_documentation.py \
            tests/docs/test_enterprise_completion.py
          task lite:docs:enterprise:check
          task lite:docs:ia:check
          task lite:docs:check
          .venv/bin/python scripts/dev/lite/redaction_check.py --paths contracts/generated docs/generated
          git diff --check

      - name: Commit generated projections and remove one-shot workflow
        run: |
          rm .github/workflows/correlation-generate-once.yml
          git add -A
          git diff --cached --check
          git config user.name 'dexter-lab-ctrl'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(security): regenerate assurance correlation projections'
          git push origin HEAD:feat/security-assurance-model-evidence-correlation
