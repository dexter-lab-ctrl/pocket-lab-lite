name: Build Pocket Lab Lite dist.zip

on:
  push:
    branches:
      - main
    tags:
      - 'lite-[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Pocket Lab Lite release tag, for example lite-2026.07.28.1. Leave empty to generate the next date-based tag.'
        required: false
        type: string
      prerelease:
        description: 'Mark the GitHub release as a prerelease.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: pocket-lab-lite-dist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-dist:
    name: Build and package Lite PWA
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Resolve release tag
        id: release_tag
        env:
          DISPATCH_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [[ -n "${DISPATCH_RELEASE_TAG:-}" ]]; then
            tag="${DISPATCH_RELEASE_TAG}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            today="$(date -u '+%Y.%m.%d')"
            latest="$(git tag -l "lite-${today}.*" | awk -F. '{print $4}' | sort -n | tail -1)"
            next="$(( ${latest:-0} + 1 ))"
            tag="lite-${today}.${next}"
          else
            tag=""
          fi
          if [[ -n "$tag" ]]; then
            python3 - "$tag" <<'PY'
          import datetime, re, sys
          tag=sys.argv[1]
          match=re.fullmatch(r'lite-(\d{4})\.(\d{2})\.(\d{2})\.([1-9]\d*)', tag)
          if not match:
              raise SystemExit('Invalid Pocket Lab Lite release tag')
          year,month,day,sequence=map(int,match.groups())
          datetime.date(year,month,day)
          if sequence > 999999:
              raise SystemExit('Release sequence is too large')
          PY
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify dist output
        run: |
          test -d dist
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js

      - name: Add embedded Lite build identity
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          build_tag="${RELEASE_TAG:-source-build}"
          python3 - "$build_tag" "$GITHUB_SHA" > dist/pocketlab-lite-build.json <<'PY'
          import datetime, json, sys
          print(json.dumps({
              'product': 'pocket-lab-lite',
              'schema_version': 1,
              'install_mode': 'release',
              'release_tag': sys.argv[1],
              'source_commit': sys.argv[2],
              'target': 'web-pwa',
              'created_at': datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),
          }, sort_keys=True, separators=(',', ':')))
          PY

      - name: Create release assets
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          rm -f dist.zip checksums.txt pocketlab-lite-release.json
          (cd dist && zip -q -r ../dist.zip .)
          sha256sum dist.zip > checksums.txt
          if [[ -n "${RELEASE_TAG:-}" ]]; then
            artifact_sha256="$(sha256sum dist.zip | awk '{print $1}')"
            python3 - "$RELEASE_TAG" "$artifact_sha256" "$GITHUB_SHA" > pocketlab-lite-release.json <<'PY'
          import datetime, json, sys
          tag,digest,commit=sys.argv[1:]
          print(json.dumps({
              'product': 'pocket-lab-lite',
              'schema_version': 1,
              'release_tag': tag,
              'artifact': 'dist.zip',
              'artifact_sha256': digest,
              'source_commit': commit,
              'target': 'web-pwa',
              'minimum_runtime_version': 'lite-native-release-v1',
              'created_at': datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),
          }, sort_keys=True, separators=(',', ':')))
          PY
          fi
          ls -lh dist.zip checksums.txt
          test -z "${RELEASE_TAG:-}" || test -s pocketlab-lite-release.json

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: pocket-lab-lite-dist
          path: |
            dist.zip
            checksums.txt
            pocketlab-lite-release.json
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub release
        if: steps.release_tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          if ! git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            git tag -a "$RELEASE_TAG" -m "Pocket Lab Lite $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi
          flags=()
          if [[ "${PRERELEASE:-false}" == "true" ]]; then
            flags+=(--prerelease)
          fi
          assets=(dist.zip checksums.txt pocketlab-lite-release.json)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "Pocket Lab Lite ${RELEASE_TAG}" \
              --notes "Pocket Lab Lite native PWA release with a verified manifest and checksums." \
              "${flags[@]}"
          fi
