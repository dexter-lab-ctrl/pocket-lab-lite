site_name: Pocket Lab Lite
site_description: Edge-first, self-hosted control plane documentation
site_author: Pocket Lab Lite
site_url: https://dexter-lab-ctrl.github.io/pocket-lab-lite/
repo_name: dexter-lab-ctrl/pocket-lab-lite
repo_url: https://github.com/dexter-lab-ctrl/pocket-lab-lite
edit_uri: edit/main/docs/
copyright: Copyright &copy; Pocket Lab Lite. Documentation generated from repository-owned sources.

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  custom_dir: docs/overrides
  logo: assets/brand/pocket-lab-logo.svg
  favicon: assets/brand/pocket-lab-logo.svg
  font: false
  icon:
    repo: fontawesome/brands/github
    previous: material/arrow-left
    next: material/arrow-right
    edit: material/pencil
    view: material/eye
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: pocketlab-light
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: pocketlab-dark
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.snippets:
      base_path:
        - docs
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/brand.css
  - stylesheets/components.css
  - stylesheets/intelligence.css
  - stylesheets/print.css

extra_javascript:
  - javascripts/docs.js

