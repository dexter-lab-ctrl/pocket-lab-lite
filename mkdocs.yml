site_name: Pocket Lab Lite
site_description: Edge-first Android/Termux control plane documentation
site_author: Pocket Lab
site_url: https://dexter-lab-ctrl.github.io/pocket-lab-lite/
repo_name: dexter-lab-ctrl/pocket-lab-lite
repo_url: https://github.com/dexter-lab-ctrl/pocket-lab-lite

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - content.code.copy
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview: index.md
  - Development:
      - Start here: generated/development/index.md
      - Repository and WSL2 setup: generated/development/repository-setup.md
      - Task ownership audit: generated/development/task-audit.md
      - Task reference: generated/development/task-reference.md
      - Architecture: generated/development/architecture.md
