schema_version: "2.0.0"
name: pocketlab-runtime-security-assurance-tools
description: >-
  Server-owned, fixed-command contracts for phone-worker, DEV-PC static, and
  DEV-PC live-runtime assurance lanes. Callers select a suite only; they never
  select an executable, argv, path, URL, environment, target, or scanner option.
execution_defaults:
  shell: false
  cwd: repository_root
  allowed_target: local_server_host_only
  allowed_target_scope: local_server_host_only
  timeout_seconds: 5
  max_output_bytes: 32768
  process_group_cleanup: true
  concurrency: exclusive_for_heavy_tools
  output_parser: first_version_line_only
  finding_normalizer: normalized_sanitized_assurance_finding
  sanitization_policy: lite_security_policy.redact_value
  failure_classification: [missing, failed, timed_out, output_limited]
toolchain:
  - id: pocketlab-security
    version_pin: runtime-reported
    installation_source: existing_pocketlab_security_worker
    purpose: Existing worker-owned Quick/Full Security lifecycle, scanner fusion, cache, SBOM, and sanitized evidence.
    execution: existing_worker_security_path
    execution_lane: server_phone_worker
    supported_platforms: [android-termux-arm64, ubuntu-wsl2]
    native_status: VERIFIED native when discovered by existing Security path
    harness_status: ACTIVE
    resource_class: heavy
    allowed_mode: registered_security_profile
    required_capability: security.assurance.sca
    suite_membership: [smoke, standard, deep]
    binary_discovery: repository_service
    version_command: existing_security_tool_result
    version_source: repository_revision
    command_id: security.existing_profile
    fixed_target: server_runtime_local
    fixed_argv: [registered_profile_only]
    parser: existing_security_projection
    sanitizer: lite_security_policy.redact_value
    timeout_seconds: 7200
    max_output_bytes: 262144
    ruleset: existing_security_registry
    template_allowlist: none
    retry_safe: true
    resume_supported: true
    checkpoint_supported: true
    max_attempts: 2
    checksum_policy: existing_security_receipt
    signature_policy: existing_security_receipt
  - id: trivy
    version_pin: runtime-reported
    installation_source: existing_pocketlab_security_worker
    purpose: Existing bounded vulnerability, misconfiguration, secret-mode, and SBOM execution through Security.
