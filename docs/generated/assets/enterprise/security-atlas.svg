<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="sa-title sa-desc"><title id="sa-title">Pocket Lab Lite Security Atlas</title><desc id="sa-desc">Architecture is the map. Security Atlas explains threats, assets, controls, trust boundaries, reviewed attack paths and evidence from canonical source.</desc><style>.bg{fill:#0b1020}.title{fill:#f2f6ff;font:700 28px system-ui,sans-serif}.sub{fill:#b9c7dc;font:500 14px system-ui,sans-serif}.card{fill:#111a2d;stroke:#3c4d70;stroke-width:1.5;rx:18}.k{fill:#7ee787;font:700 12px system-ui,sans-serif;letter-spacing:.08em}.h{fill:#f2f6ff;font:700 18px system-ui,sans-serif}.p{fill:#b9c7dc;font:500 12px system-ui,sans-serif}.line{stroke:#58a6ff;stroke-width:2;opacity:.55}</style><rect class="bg" width="1200" height="720"/><text class="title" x="55" y="64">Pocket Lab Lite Security Atlas</text><text class="sub" x="55" y="92">Architecture is the map. The Atlas is a deterministic security projection — never live monitoring.</text><rect class="card" x="55" y="135" width="320" height="190"/><text class="k" x="79" y="173">The map</text><text class="h" x="79" y="207">Architecture</text><text class="p" x="79" y="243">Canonical topology and ownership stay</text><text class="p" x="79" y="265">architecture-owned.</text><rect class="card" x="420" y="135" width="320" height="190"/><text class="k" x="444" y="173">54 entries</text><text class="h" x="444" y="207">Threat Atlas</text><text class="p" x="444" y="243">STRIDE candidates and their reviewed</text><text class="p" x="444" y="265">source-derived control relationships.</text><rect class="card" x="785" y="135" width="320" height="190"/><text class="k" x="809" y="173">19 entries</text><text class="h" x="809" y="207">System Atlas</text><text class="p" x="809" y="243">Canonical architecture components, trust</text><text class="p" x="809" y="265">boundaries, assets and promoted posture.</text><rect class="card" x="55" y="390" width="320" height="190"/><text class="k" x="79" y="428">17 entries</text><text class="h" x="79" y="462">Attack Surface Atlas</text><text class="p" x="79" y="498">Entry surfaces, trust boundaries and</text><text class="p" x="79" y="520">reviewed modeled attack paths.</text><rect class="card" x="420" y="390" width="320" height="190"/><text class="k" x="444" y="428">7 entries</text><text class="h" x="444" y="462">Control Atlas</text><text class="p" x="444" y="498">Controls, coverage, threat relationships</text><text class="p" x="444" y="520">and consequences if controls fail.</text><rect class="card" x="785" y="390" width="320" height="190"/><text class="k" x="809" y="428">41 entries</text><text class="h" x="809" y="462">Evidence Atlas</text><text class="p" x="809" y="498">Promoted/canonical evidence lineage and</text><text class="p" x="809" y="520">posture signals; never live monitoring.</text><path class="line" d="M 375 230 L 420 230 M 740 230 L 785 230 M 375 485 L 420 485 M 740 485 L 785 485"/><text class="sub" x="55" y="665">Canonical source → deterministic projection → human review. No probabilistic scoring, exploit prediction, runtime polling or automatic attack-path invention.</text></svg>
