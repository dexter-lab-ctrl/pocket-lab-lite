version: '3'

vars:
  PARITY_TOOLS: '{{default ".pocketlab-dev/tools/parity/bin" .PARITY_TOOLS}}'
  LITE_PARITY_API_URL: '{{default "http://127.0.0.1:18080" .LITE_PARITY_API_URL}}'
  LITE_PARITY_TERMUX_API_URL: '{{default "http://127.0.0.1:8080" .LITE_PARITY_TERMUX_API_URL}}'
  POCKETLAB_TERMUX_SSH_ALIAS: '{{default "pocketlab-termux" .POCKETLAB_TERMUX_SSH_ALIAS}}'

tasks:
  lite:parity:tools:check:
    desc: Verify locally pinned parity tools without changing the host
    cmds:
      - bash scripts/dev/lite/setup-parity-tools.sh --check

  lite:parity:model:check:
    desc: Validate the canonical seven-tab parity model, comparators, runtime scenarios, and bounded pairwise catalog
    cmds:
      - '{{.PYTHON}} scripts/docs/parity/generate_parity.py fingerprint'
      - 'PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 {{.PYTHON}} -m pytest -q tests/parity/test_intelligent_runtime_parity.py -k model'

  lite:parity:contracts:generate:
    desc: Generate canonical seven-tab parity contracts from one repository-owned model
    cmds:
      - '{{.PYTHON}} scripts/docs/parity/generate_parity.py generate'

  lite:parity:contracts:check:
    desc: Validate parity schemas, fingerprints, linkage, redaction, and contract drift
    cmds:
      - '{{.PYTHON}} scripts/docs/parity/generate_parity.py check'
      - 'PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 {{.PYTHON}} -m pytest -q tests/parity/test_contract_generation.py'

  lite:parity:fixtures:generate:
    desc: Preserve deterministic Recovery fixtures and generate the all-tab semantic scenario registries
    cmds:
      - '{{.PYTHON}} scripts/docs/parity/generate_parity.py generate'

  lite:parity:fixtures:check:
    desc: Check generated fixtures plus real all-tab selector/presentation linkage
    cmds:
      - '{{.PYTHON}} scripts/docs/parity/generate_parity.py check'
      - node scripts/test/parity/check_recovery_selector.mjs
      - node scripts/test/parity/check_domain_selectors.mjs
      - npm run test:parity:selectors

  lite:parity:backend:
    desc: Verify Recovery backend authority to allowlisted API projection parity
    cmds:
      - 'PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 {{.PYTHON}} -m pytest -q tests/parity/test_backup_recovery_parity.py tests/backend/test_lite_recovery.py'

  lite:parity:api:
    desc: Verify Recovery API contracts, pagination, property-test guardrails, and safe GET filters
    cmds:
      - 'PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 {{.PYTHON}} -m pytest -q tests/parity/test_guardrails.py tests/parity/test_api_contract_fences.py'

  lite:parity:selectors:
    desc: Verify repository-derived all-tab selector and direct-render presentation contracts
    cmds:
      - node scripts/test/parity/check_recovery_selector.mjs
      - node scripts/test/parity/check_domain_selectors.mjs
      - npm run test:parity:selectors

  lite:parity:storybook:
    desc: Build Storybook and verify repository-linked parity story coverage
    cmds:
      - npm run build-storybook
      - 'test -f storybook-static/index.html'

  lite:parity:playwright:mocked:
    desc: Run deterministic mocked semantic parity in desktop and mobile Chromium
    deps: [lite:playwright:preflight]
    cmds:
      - npm run test:e2e:parity

  lite:parity:playwright:live:
    desc: Run existing live read-only browser verification against the configured Lite origin
    deps: [lite:playwright:preflight]
    cmds:
      - 'LITE_E2E_LIVE=1 LITE_E2E_MODE=live npx playwright test tests/e2e/lite-live.spec.ts --project=live-desktop --project=live-mobile'

  lite:parity:runtime:capture:
    desc: Capture bounded sanitized backend observations for all seven Lite tabs
    cmds:
      - '{{.PYTHON}} scripts/test/parity/capture_runtime_parity.py --kind backend --base-url "{{.LITE_PARITY_API_URL}}" --release-tag "{{.LITE_PARITY_RELEASE_TAG}}"'

  lite:parity:termux:
    desc: Capture bounded sanitized all-tab observations through the managed read-only Termux SSH loopback
    cmds:
      - '{{.PYTHON}} scripts/test/parity/capture_runtime_parity.py --kind termux --ssh-alias "{{.POCKETLAB_TERMUX_SSH_ALIAS}}" --base-url "{{.LITE_PARITY_TERMUX_API_URL}}" --release-tag "{{.LITE_PARITY_RELEASE_TAG}}"'

  lite:parity:runtime:compare:
    desc: Compare backend, Termux, live desktop, and live mobile observations semantically without changing app behavior
    cmds:
      - '{{.PYTHON}} scripts/test/parity/compare_runtime_parity.py'

  lite:api:schemathesis:
    desc: Run bounded read-only Schemathesis checks against safe Recovery GET endpoints
    cmds:
      - >-
        LITE_API_DIRECT_URL="{{.LITE_PARITY_API_URL}}"
        LITE_PARITY_OPENAPI_URL="{{.LITE_PARITY_API_URL}}/openapi.json"
        bash scripts/test/parity/run_schemathesis.sh

  lite:api:read-latency:
    desc: Capture bounded cold and warm read latency evidence from the configured loopback API
    cmds:
      - >-
        {{.PYTHON}} scripts/test/parity/probe_read_latency.py
        --base-url "{{.LITE_PARITY_API_URL}}"
        --output "{{.VALIDATION_DIR}}/parity/read-latency.json"
        --samples 3
        --timeout 30

  lite:api:breaking-changes:
    desc: Check the current OpenAPI contract against an explicitly promoted baseline
    cmds:
      - bash scripts/test/parity/run_oasdiff.sh

  lite:a11y:check:
    desc: Run the existing mocked accessibility gate
    cmds:
      - task: lite:test:a11y

  lite:visual:check:
    desc: Run the existing mocked visual-regression gate
    cmds:
      - task: lite:test:visual

  lite:performance:edge:
    desc: Run one-VU bounded read-only parity checks for edge hardware
    cmds:
      - '{{.PARITY_TOOLS}}/k6 run performance/parity/edge-readonly.js'

  lite:performance:wsl:
    desc: Run three-VU bounded read-only parity checks from WSL2
    cmds:
      - '{{.PARITY_TOOLS}}/k6 run performance/parity/wsl-readonly.js'

  lite:docs:parity:generate:
    desc: Generate the complete Development parity portfolio and Production readiness page
    cmds:
      - '{{.PYTHON}} scripts/docs/parity/generate_parity.py generate'

  lite:docs:parity:check:
    desc: Check deterministic generated parity documentation and MkDocs navigation linkage
    cmds:
      - '{{.PYTHON}} scripts/docs/parity/generate_parity.py check'
      - 'PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 {{.PYTHON}} -m pytest -q tests/parity/test_contract_generation.py -k generated_documentation'

  lite:evidence:parity:generate:
    desc: Generate sanitized unvalidated evidence templates without fabricating PASS results
    cmds:
      - '{{.PYTHON}} scripts/test/parity/parity_evidence.py generate'

  lite:evidence:parity:check:
    desc: Validate parity evidence schemas, bounds, linkage, and redaction
    cmds:
      - '{{.PYTHON}} scripts/test/parity/parity_evidence.py check'

  lite:evidence:runtime:promote:
    desc: Explicitly promote sanitized all-tab semantic evidence, including truthful drift, for a tagged release
    preconditions:
      - sh: 'test -n "{{.LITE_PARITY_RELEASE_TAG}}"'
        msg: Set LITE_PARITY_RELEASE_TAG to the installed Lite release tag before promotion
    cmds:
      - '{{.PYTHON}} scripts/test/parity/promote_runtime_verification.py promote --release-tag "{{.LITE_PARITY_RELEASE_TAG}}"'
      - '{{.PYTHON}} scripts/docs/parity/generate_parity.py generate'

  lite:evidence:runtime:check:
    desc: Validate the committed sanitized runtime verification baseline
    cmds:
      - '{{.PYTHON}} scripts/test/parity/promote_runtime_verification.py check'
      - 'PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 {{.PYTHON}} -m pytest -q tests/parity/test_runtime_verification_promotion.py'

  lite:parity:check:
    desc: Aggregate deterministic Backend-to-Frontend parity readiness gate; live phone checks remain separate
    cmds:
      - task: lite:parity:tools:check
      - task: lite:parity:model:check
      - task: lite:parity:contracts:check
      - task: lite:parity:fixtures:check
      - task: lite:parity:backend
      - task: lite:parity:api
      - task: lite:parity:selectors
      - task: lite:parity:storybook
      - task: lite:parity:playwright:mocked
      - task: lite:a11y:check
      - task: lite:visual:check
      - task: lite:evidence:parity:generate
      - task: lite:evidence:parity:check
      - task: lite:evidence:runtime:check
      - task: lite:docs:parity:check

  lite:api:schemathesis:discovery:
    desc: Record broad read-only API/OpenAPI conformance findings without gating parity
    cmds:
      - >-
        LITE_API_DIRECT_URL="{{.LITE_PARITY_API_URL}}"
        LITE_PARITY_OPENAPI_URL="{{.LITE_PARITY_API_URL}}/openapi.json"
        bash scripts/test/parity/run_schemathesis_discovery.sh
