version: '3'

tasks:

  lite:runtime:ssh:setup:
    desc: Configure the managed WSL-only Termux SSH alias after explicit host-key approval
    cmds:
      - bash scripts/docs/runtime/setup_termux_ssh.sh --configure

  lite:runtime:ssh:check:
    desc: Verify the managed private, key-only, host-key-checked Termux SSH alias
    cmds:
      - bash scripts/docs/runtime/check_termux_ssh.sh

  lite:runtime:termux:capture:
    desc: Run one bounded read-only SSH probe and create a local sanitized projection
    cmds:
      - bash scripts/docs/runtime/capture_termux_runtime.sh

  lite:runtime:termux:inspect:
    desc: Inspect the latest safe local Termux projection without printing identities
    cmds:
      - '{{.PYTHON}} scripts/docs/runtime/promote_termux_runtime.py inspect'

  lite:runtime:termux:validate:
    desc: Validate the latest sanitized projection and candidate baseline
    cmds:
      - '{{.PYTHON}} scripts/docs/runtime/promote_termux_runtime.py validate'

  lite:runtime:termux:diff:
    desc: Show a semantic path-only diff against the promoted runtime baseline
    cmds:
      - '{{.PYTHON}} scripts/docs/runtime/promote_termux_runtime.py diff'

  lite:runtime:termux:promote:
    desc: Explicitly promote the latest safe projection; requires LITE_RUNTIME_PROMOTE=1
    cmds:
      - '{{.PYTHON}} scripts/docs/runtime/promote_termux_runtime.py promote'

  lite:runtime:termux:clean:
    desc: Remove transient raw layers and stale local captures idempotently
    cmds:
      - '{{.PYTHON}} scripts/docs/runtime/promote_termux_runtime.py clean'

  lite:docs:runtime:generate:
    desc: Generate tracked runtime contracts and pages from the promoted baseline only
    cmds:
      - '{{.PYTHON}} scripts/docs/runtime/generate_termux_runtime_docs.py generate'

  lite:docs:runtime:check:
    desc: Check promoted runtime baseline schemas, redaction, determinism, and generated drift
    cmds:
      - '{{.PYTHON}} scripts/docs/runtime/generate_termux_runtime_docs.py check'
      - '{{.PYTHON}} scripts/docs/runtime/runtime_redaction.py --paths architecture/runtime-baselines contracts/generated/runtime docs/generated/development/runtime-verification.md docs/generated/production/android-termux-runtime.md docs/generated/production/services-pm2-runtime.md docs/generated/production/remote-access-runtime.md'

  lite:docs:health:generate:
    desc: Generate release-bound Lite domain operational health and platform capability evidence from promoted sanitized runtime verification
    cmds:
      - '{{.PYTHON}} scripts/docs/runtime/generate_domain_operational_health.py generate'

  lite:docs:health:check:
    desc: Check release binding, schema, health/parity independence, capability roles, sanitization, and deterministic operational-health drift
    cmds:
      - '{{.PYTHON}} scripts/docs/runtime/generate_domain_operational_health.py check'
      - 'PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 {{.PYTHON}} -m pytest -q tests/docs/test_operational_health_bridge.py'
  lite:docs:tools:check:
    desc: Verify pinned development-only documentation tools without changing the host
    cmds:
      - bash scripts/dev/lite/setup-documentation-tools.sh --check

  lite:contracts:generate:
    desc: Export the FastAPI Lite OpenAPI contract and generate sanitized canonical fixtures
    cmds:
      - '{{.PYTHON}} scripts/docs/lite/generate_contracts.py generate'

  lite:contracts:check:
    desc: Check OpenAPI and fixture drift without modifying source
    cmds:
      - '{{.PYTHON}} scripts/docs/lite/generate_contracts.py check'
      - npx redocly lint contracts/generated/lite-openapi.json

  lite:docs:openapi:
    desc: Export OpenAPI, generate the detailed Lite API reference, and run Redocly
    cmds:
      - task: lite:contracts:generate
      - '{{.PYTHON}} scripts/docs/lite/generate_platform_catalogs.py generate --section openapi'
      - npx redocly lint contracts/generated/lite-openapi.json

  lite:docs:events:
    desc: Generate the Lite NATS and AsyncAPI event catalog
    cmds:
      - '{{.PYTHON}} scripts/docs/lite/generate_platform_catalogs.py generate --section events'

  lite:docs:frontend-api:
    desc: Generate frontend/API ownership and field-level compatibility reports
    cmds:
      - '{{.PYTHON}} scripts/docs/lite/generate_platform_catalogs.py generate --section frontend-api'

  lite:docs:capabilities:
    desc: Generate canonical device capability and role catalogs
    cmds:
      - '{{.PYTHON}} scripts/docs/lite/generate_platform_catalogs.py generate --section capabilities'

  lite:docs:reason-codes:
    desc: Generate and validate the canonical reason-code registry
    cmds:
      - '{{.PYTHON}} scripts/docs/lite/run_platform_catalogs.py generate --section reason-codes'

  lite:docs:sqlite:
    desc: Generate data-free SQLite metadata and normalized SchemaSpy documentation
    cmds:
      - '{{.PYTHON}} scripts/docs/lite/generate_platform_catalogs.py generate --section sqlite'
      - '{{.PYTHON}} scripts/docs/sqlite/generate_schemaspy.py generate'

  lite:docs:sqlite:check:
    desc: Check data-free SQLite metadata and SchemaSpy drift
    cmds:
      - '{{.PYTHON}} scripts/docs/lite/generate_platform_catalogs.py check --section sqlite'
      - '{{.PYTHON}} scripts/docs/sqlite/generate_schemaspy.py check'

  lite:docs:projections:
    desc: Generate the prepared-projection ownership and freshness catalog
    cmds:
      - '{{.PYTHON}} scripts/docs/lite/generate_platform_catalogs.py generate --section projections'

  lite:docs:bootstrap:
    desc: Generate bootstrap-stage documentation without executing any stage
    cmds:
      - '{{.PYTHON}} scripts/docs/lite/generate_platform_catalogs.py generate --section bootstrap'

  lite:docs:services:
    desc: Generate the approved PM2 service catalog
    cmds:
      - '{{.PYTHON}} scripts/docs/lite/generate_platform_catalogs.py generate --section services'

  lite:docs:ui:
    desc: Generate the canonical Storybook UI-state catalog
    cmds:
      - '{{.PYTHON}} scripts/docs/lite/generate_platform_catalogs.py generate --section ui'

  lite:docs:ui:screenshots:
    desc: Build Storybook once and capture bounded mobile and desktop documentation screenshots
    deps: [lite:playwright:preflight]
    cmds:
      - npm run build-storybook
      - node scripts/docs/lite/capture-storybook.mjs

  lite:docs:recovery:
    desc: Generate Recovery contract and state-machine references
    cmds:
      - '{{.PYTHON}} scripts/docs/lite/generate_platform_catalogs.py generate --section recovery'

  lite:docs:security:
    desc: Generate canonical Security profile documentation
    cmds:
      - '{{.PYTHON}} scripts/docs/lite/generate_platform_catalogs.py generate --section security'

  lite:docs:configuration:
    desc: Generate sanitized environment-variable documentation
    cmds:
      - '{{.PYTHON}} scripts/docs/lite/generate_platform_catalogs.py generate --section configuration'

  lite:docs:validation:
    desc: Generate readiness documentation only from recorded validation evidence
    cmds:
      - '{{.PYTHON}} scripts/docs/lite/generate_platform_catalogs.py generate --section validation'

  lite:docs:release-evidence:
    desc: Generate release documents only from verified release manifests
    cmds:
      - '{{.PYTHON}} scripts/docs/lite/generate_platform_catalogs.py generate --section release'

  lite:docs:redaction:
    desc: Generate consolidated redaction and secret-safety coverage
    cmds:
      - '{{.PYTHON}} scripts/docs/lite/generate_platform_catalogs.py generate --section redaction'

  lite:docs:architecture:icons:check:
    desc: Verify pinned repository-owned architecture icons without network access
    cmds:
      - bash scripts/dev/lite/setup-architecture-icons.sh --check

  lite:docs:architecture:generate:
    desc: Generate Production architecture pages, catalogs, and light/dark Graphviz diagrams
    deps: [lite:docs:architecture:icons:check]
    cmds:
      - '{{.PYTHON}} scripts/docs/graphviz/generate_lite_architecture.py generate'

  lite:docs:architecture:validate:
    desc: Validate canonical architecture metadata, sources, icons, links, and accessibility
    deps: [lite:docs:architecture:icons:check]
    cmds:
      - '{{.PYTHON}} scripts/docs/graphviz/generate_lite_architecture.py validate'

  lite:docs:architecture:check:
    desc: Check Production architecture model and generated artifact drift
    deps: [lite:docs:architecture:validate]
    cmds:
      - '{{.PYTHON}} scripts/docs/graphviz/generate_lite_architecture.py check'

  lite:docs:diagrams:generate:
    desc: Generate linked light and dark Graphviz architecture diagrams
    cmds:
      - '{{.PYTHON}} scripts/docs/graphviz/generate_lite_diagrams.py generate'

  lite:docs:diagrams:check:
    desc: Check Graphviz source and SVG drift
    cmds:
      - '{{.PYTHON}} scripts/docs/graphviz/generate_lite_diagrams.py check'

  lite:docs:development:generate:
    desc: Generate source-grounded Development documentation
    cmds:
      - '{{.PYTHON}} scripts/docs/lite/generate_docs.py generate --audience development'

  lite:docs:development:check:
    desc: Check Development documentation drift and safety
    cmds:
      - '{{.PYTHON}} scripts/docs/lite/generate_docs.py check --audience development'

  lite:docs:production:generate:
    desc: Generate verified deployable Production user documentation
    cmds:
      - '{{.PYTHON}} scripts/docs/lite/generate_docs.py generate --audience production'

  lite:docs:production:check:
    desc: Check Production documentation drift and partial/planned boundaries
    cmds:
      - '{{.PYTHON}} scripts/docs/lite/generate_docs.py check --audience production'

  lite:docs:platform:generate:
    desc: Generate all lightweight source-derived catalogs in one bounded process
    cmds:
      - '{{.PYTHON}} scripts/docs/lite/run_platform_catalogs.py generate --section all'

  lite:docs:platform:check:
    desc: Check all lightweight source-derived catalog drift and safety
    cmds:
      - '{{.PYTHON}} scripts/docs/lite/run_platform_catalogs.py check --section all'

  lite:docs:knowledge:generate:
    desc: Generate the living Pocket Lab Lite knowledge graph, AI export, Development/Production pages, and Enterprise Knowledgebase graph projection
    cmds:
      - '{{.PYTHON}} scripts/docs/knowledge/generate_knowledge.py generate'

  lite:docs:knowledge:check:
    desc: Check knowledge schemas, graph integrity, Enterprise Knowledgebase graph projection, links, sanitization, and generated drift
    cmds:
      - '{{.PYTHON}} scripts/docs/knowledge/generate_knowledge.py check'

  lite:docs:codebase-map:generate:
    desc: Generate the deterministic Git-tracked Codebase Map model, browser projection, documentation health, and clean structural delta
    cmds:
      - '{{.PYTHON}} scripts/docs/knowledge/generate_codebase_map.py generate'

  lite:docs:codebase-map:check:
    desc: Check Codebase Map schema, Git inventory parity, relationships, redaction, browser projection, and clean structural delta
    cmds:
      - '{{.PYTHON}} scripts/docs/knowledge/generate_codebase_map.py check'
      - 'PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 {{.PYTHON}} -m pytest -q tests/docs/test_codebase_map.py'

  lite:docs:knowledge:graph:
    desc: Validate the canonical knowledge graph and backlinks
    cmds:
      - '{{.PYTHON}} scripts/docs/knowledge/generate_knowledge.py graph'

  lite:docs:knowledge:health:
    desc: Validate the generated operational-health encyclopedia
    cmds:
      - '{{.PYTHON}} scripts/docs/knowledge/generate_knowledge.py health'

  lite:docs:knowledge:traceability:
    desc: Validate requirement, implementation, and test traceability
    cmds:
      - '{{.PYTHON}} scripts/docs/knowledge/generate_knowledge.py traceability'

  lite:docs:knowledge:releases:
    desc: Validate release knowledge and semantic change metadata
    cmds:
      - '{{.PYTHON}} scripts/docs/knowledge/generate_knowledge.py releases'

  lite:docs:knowledge:ai-export:
    desc: Validate the sanitized deterministic AI-ready knowledge export
    cmds:
      - '{{.PYTHON}} scripts/docs/knowledge/generate_knowledge.py ai-export'

  lite:docs:intelligence:generate:
    desc: Generate diagnostic Documentation Intelligence and Experience views from canonical source and promoted evidence
    cmds:
      - '{{.PYTHON}} scripts/docs/intelligence/generate_documentation_intelligence.py generate'

  lite:docs:intelligence:check:
    desc: Check Documentation Intelligence, UX contract, performance budgets, sanitization, and generated drift
    cmds:
      - '{{.PYTHON}} scripts/docs/intelligence/generate_documentation_intelligence.py check'
      - 'PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 {{.PYTHON}} -m pytest -q tests/docs/test_documentation_intelligence.py'

  lite:docs:ia:generate:
    desc: Generate deterministic Documentation Platform IA hubs, feature journeys, page inventory, cross-links, and static search metadata
    cmds:
      - '{{.PYTHON}} scripts/docs/enterprise/documentation_ia.py generate'

  lite:docs:ia:check:
    desc: Check Documentation Platform IA determinism, canonical navigation ownership, bounded relationships, search destinations, and redaction fences
    cmds:
      - '{{.PYTHON}} scripts/docs/enterprise/documentation_ia.py check'
      - 'PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 {{.PYTHON}} -m pytest -q tests/docs/test_documentation_ia.py'

  lite:docs:enterprise:generate:
    desc: Generate enterprise documentation intelligence, threat model, dependency visualizations, engineering handbooks, and fail-closed release/supply-chain projections
    cmds:
      - '{{.PYTHON}} scripts/docs/enterprise/generate_enterprise_documentation.py generate'

  lite:docs:enterprise:check:
    desc: Check enterprise Documentation Platform determinism, IA, page anatomy, search synonyms, sanitization, and canonical threat/release/supply-chain projections
    cmds:
      - '{{.PYTHON}} scripts/docs/enterprise/generate_enterprise_documentation.py check'
      - task: lite:docs:ia:check
      - 'PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 {{.PYTHON}} -m pytest -q tests/docs/test_enterprise_documentation.py tests/docs/test_enterprise_completion.py'

  lite:docs:enterprise-tools:plan:
    desc: Show the complete idempotent WSL2/CI Documentation Platform tool plan, including optional Threat Dragon/Dependency-Track when requested
    cmds:
      - 'bash scripts/dev/lite/setup-documentation-enterprise-tools.sh --plan {{if .INCLUDE_OPTIONAL}}--include-optional{{end}}'

  lite:docs:enterprise-tools:setup:
    desc: Install only missing pinned Documentation Platform, security/supply-chain and architecture-icon tooling on WSL2/Ubuntu/CI
    cmds:
      - 'bash scripts/dev/lite/setup-documentation-enterprise-tools.sh --install-missing {{if .INCLUDE_OPTIONAL}}--include-optional{{end}}'

  lite:docs:enterprise-tools:check:
    desc: Verify the complete pinned enterprise documentation toolchain without downloads, upgrades, runtime access or scanner execution
    cmds:
      - 'bash scripts/dev/lite/setup-documentation-enterprise-tools.sh --check {{if .INCLUDE_OPTIONAL}}--include-optional{{end}}'

  lite:docs:enterprise-tools:update:
    desc: Explicitly update reviewed security-tool pins and repair architecture icons; never runs automatically
    cmds:
      - 'bash scripts/dev/lite/setup-documentation-enterprise-tools.sh --update {{if .INCLUDE_OPTIONAL}}--include-optional{{end}}'

  lite:docs:release-assurance:capture:
    desc: Explicitly capture and verify sanitized GitHub Release identity/artifact evidence into transient .pocketlab-dev storage; never called by MkDocs
    cmds:
      - 'test -n "{{.TAG}}" && test -n "{{.REPO}}" || (echo "TAG and REPO are required" >&2; exit 2)'
      - '{{.PYTHON}} scripts/docs/enterprise/release_evidence_promotion.py capture --tag {{.TAG}} --repo {{.REPO}}'

  lite:docs:release-assurance:promote:
    desc: Explicitly promote a validated release capture into append-only canonical release evidence
    cmds:
      - 'test -n "{{.TAG}}" || (echo "TAG is required" >&2; exit 2)'
      - 'POCKETLAB_RELEASE_EVIDENCE_PROMOTE=1 {{.PYTHON}} scripts/docs/enterprise/release_evidence_promotion.py promote --tag {{.TAG}}'

  lite:docs:release-assurance:check:
    desc: Validate promoted release evidence offline without GitHub polling
    cmds:
      - '{{.PYTHON}} scripts/docs/enterprise/release_evidence_promotion.py check'

  lite:docs:security-tools:plan:
    desc: Show the pinned architecture-aware WSL2/CI security-tool installation plan without downloading anything
    cmds:
      - bash scripts/dev/lite/setup-documentation-security-tools.sh --plan

  lite:docs:security-tools:setup:
    desc: Install missing pinned Documentation Platform security/supply-chain tools plus the existing Graphviz/SchemaSpy documentation prerequisites on WSL2/CI without upgrading working tools
    cmds:
      - bash scripts/dev/lite/setup-documentation-tools.sh --install-missing
      - bash scripts/dev/lite/setup-documentation-security-tools.sh --install-missing

  lite:docs:security-tools:update:
    desc: Explicitly update/replace mismatched Documentation Platform security tools to the canonical reviewed pins; never runs automatically
    cmds:
      - bash scripts/dev/lite/setup-documentation-security-tools.sh --update

  lite:docs:security-tools:check:
    desc: Check existing Graphviz/SchemaSpy prerequisites plus pinned heavy Documentation Platform security/supply-chain tools on WSL2/CI without installing or upgrading them
    cmds:
      - bash scripts/dev/lite/setup-documentation-tools.sh --check
      - bash scripts/dev/lite/check-documentation-security-tools.sh

  lite:docs:supply-chain:capture:
    desc: Run a bounded local/CI diagnostic supply-chain capture into transient .pocketlab-dev evidence; never invoked by docs generation and never treated as release qualification by itself
    deps: [lite:dev:scratch:prepare]
    cmds:
      - 'bash scripts/dev/lite/dev-scratch.sh run security-tools -- {{.PYTHON}} scripts/docs/enterprise/supply_chain_automation.py capture {{if .RUN_DIR}}--run-dir {{.RUN_DIR}}{{end}} {{if .INCLUDE_GIT_HISTORY}}--include-git-history{{end}} {{if .SCANNER}}--only {{.SCANNER}}{{end}} {{if .ENABLE_SCANCODE}}--enable-scancode{{end}}'

  lite:docs:supply-chain:resume:
    desc: Resume an interrupted bounded supply-chain capture from its validated checkpoint without rerunning successful scanner steps
    deps: [lite:dev:scratch:prepare]
    cmds:
      - 'test -n "{{.RUN_DIR}}" || (echo "RUN_DIR is required" >&2; exit 2)'
      - 'bash scripts/dev/lite/dev-scratch.sh run security-tools -- {{.PYTHON}} scripts/docs/enterprise/supply_chain_automation.py capture --run-dir {{.RUN_DIR}} --resume {{if .INCLUDE_GIT_HISTORY}}--include-git-history{{end}} {{if .SCANNER}}--only {{.SCANNER}}{{end}} {{if .ENABLE_SCANCODE}}--enable-scancode{{end}}'

  lite:docs:supply-chain:status:
    desc: Show checkpointed per-scanner progress and the last sanitized failure classification for a transient supply-chain run
    cmds:
      - 'test -n "{{.RUN_DIR}}" || (echo "RUN_DIR is required" >&2; exit 2)'
      - '{{.PYTHON}} scripts/docs/enterprise/supply_chain_automation.py status --run-dir {{.RUN_DIR}}'

  lite:docs:supply-chain:qualify:local:
    desc: Explicit local diagnostic qualification for development only; canonical release qualification remains CI-owned
    deps: [lite:dev:scratch:prepare]
    cmds:
      - |
        set -euo pipefail
        run_dir=".pocketlab-dev/documentation-security/runs/local-$(date -u +%Y%m%dT%H%M%SZ)-$$"
        history_arg=""
        if [ -n "{{.INCLUDE_GIT_HISTORY}}" ]; then history_arg="--include-git-history"; fi
        bash scripts/dev/lite/dev-scratch.sh run security-tools -- \
          {{.PYTHON}} scripts/docs/enterprise/supply_chain_automation.py capture --run-dir "$run_dir" $history_arg
        {{.PYTHON}} scripts/docs/enterprise/supply_chain_automation.py promote --run-dir "$run_dir"
        {{.PYTHON}} scripts/docs/enterprise/supply_chain_automation.py check
        printf 'Local diagnostic supply-chain evidence promoted from %s; this is not canonical release qualification.\n' "$run_dir"

  lite:docs:supply-chain:qualify:
    desc: Dispatch the canonical release qualification to GitHub Actions; does not run heavy scanners inside VS Code/WSL interactively
    cmds:
      - |
        set -euo pipefail
        command -v gh >/dev/null 2>&1 || { echo "ERROR gh CLI is required for canonical release qualification" >&2; exit 2; }
        test "$(git branch --show-current)" = "main" || { echo "ERROR canonical release qualification must be dispatched from main" >&2; exit 2; }
        test -z "$(git status --porcelain)" || { echo "ERROR working tree must be clean before release qualification" >&2; exit 2; }
        git fetch origin main
        test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "ERROR local main must exactly match origin/main" >&2; exit 2; }
        history="false"
        if [ -n "{{.INCLUDE_GIT_HISTORY}}" ]; then history="true"; fi
        deep_license="false"
        if [ -n "{{.DEEP_LICENSE_SCAN}}" ]; then deep_license="true"; fi
        gh workflow run docs-security-supply-chain.yml --ref main \
          -f include_git_history="$history" \
          -f deep_license_scan="$deep_license"
        printf 'PASS canonical release qualification dispatched to GitHub Actions for %s\n' "$(git rev-parse HEAD)"
        printf 'Use: gh run list --workflow docs-security-supply-chain.yml --branch main --limit 5\n'
        printf 'Inspect the selected run with the one-shot command: gh run view <run-id>.\n'

  lite:docs:supply-chain:promote:
    desc: Explicitly normalize and promote a reviewed WSL2/CI supply-chain capture into sanitized canonical CycloneDX/security contracts
    cmds:
      - 'test -n "{{.RUN_DIR}}" || (echo "RUN_DIR is required, e.g. task lite:docs:supply-chain:promote RUN_DIR=.pocketlab-dev/documentation-security/runs/<run>" >&2; exit 2)'
      - '{{.PYTHON}} scripts/docs/enterprise/supply_chain_automation.py promote --run-dir {{.RUN_DIR}}'

  lite:docs:supply-chain:check:
    desc: Validate already-promoted canonical supply-chain evidence without running scanners or accessing runtime
    cmds:
      - '{{.PYTHON}} scripts/docs/enterprise/supply_chain_automation.py check'

  lite:docs:supply-chain:dependency-track:export:
    desc: Stage canonical CycloneDX files for optional Dependency-Track import; MkDocs never depends on the external service
    cmds:
      - '{{.PYTHON}} scripts/docs/enterprise/supply_chain_automation.py dependency-track-export'

  lite:docs:provenance:generate:
    desc: Generate SLSA-style release provenance metadata without claiming a formal SLSA level or signing implicitly
    cmds:
      - '{{.PYTHON}} scripts/docs/enterprise/release_provenance.py generate'

  lite:docs:provenance:sign:
    desc: Explicitly sign a release artifact with Cosign keyless/default Sigstore flow; ARTIFACT and BUNDLE are required and no private key is stored by the task
    cmds:
      - 'test -n "{{.ARTIFACT}}" && test -n "{{.BUNDLE}}" || (echo "ARTIFACT and BUNDLE are required" >&2; exit 2)'
      - '{{.PYTHON}} scripts/docs/enterprise/release_provenance.py sign --artifact {{.ARTIFACT}} --bundle {{.BUNDLE}}'

  lite:docs:provenance:verify:
    desc: Explicitly verify a Cosign/Sigstore blob bundle against the expected certificate identity and OIDC issuer
    cmds:
      - 'test -n "{{.ARTIFACT}}" && test -n "{{.BUNDLE}}" && test -n "{{.IDENTITY}}" && test -n "{{.ISSUER}}" || (echo "ARTIFACT, BUNDLE, IDENTITY and ISSUER are required" >&2; exit 2)'
      - '{{.PYTHON}} scripts/docs/enterprise/release_provenance.py verify --artifact {{.ARTIFACT}} --bundle {{.BUNDLE}} --identity {{.IDENTITY}} --issuer {{.ISSUER}}'

  lite:docs:provenance:sign-release-set:
    desc: Explicitly sign all applicable local release artifacts (dist.zip, release manifest, CycloneDX SBOMs, provenance) into transient Sigstore bundles
    cmds:
      - '{{.PYTHON}} scripts/docs/enterprise/release_provenance.py sign-release-set {{if .SIGNATURE_DIR}}--directory {{.SIGNATURE_DIR}}{{end}}'

  lite:docs:provenance:verify-release-set:
    desc: Verify every release-set Sigstore bundle and optionally promote only sanitized verification evidence into the canonical release documentation contract
    cmds:
      - 'test -n "{{.IDENTITY}}" && test -n "{{.ISSUER}}" || (echo "IDENTITY and ISSUER are required" >&2; exit 2)'
      - '{{.PYTHON}} scripts/docs/enterprise/release_provenance.py verify-release-set {{if .SIGNATURE_DIR}}--directory {{.SIGNATURE_DIR}}{{end}} --identity {{.IDENTITY}} --issuer {{.ISSUER}} {{if .PROMOTE}}--promote{{end}}'

  lite:docs:generate:
    desc: Generate contracts, catalogs, runtime evidence, architecture, Development/Production docs, SchemaSpy, and diagrams
    cmds:
      - task: lite:docs:tools:check
      - task: lite:contracts:generate
      - task: lite:docs:platform:generate
      - task: lite:docs:runtime:generate
      - task: lite:docs:parity:generate
      - task: lite:docs:health:generate
      - task: lite:docs:architecture:generate
      - task: lite:docs:knowledge:generate
      - task: lite:docs:intelligence:generate
      - task: lite:docs:development:generate
      - task: lite:docs:production:generate
      - task: lite:docs:enterprise:generate
      - '{{.PYTHON}} scripts/docs/sqlite/generate_schemaspy.py generate'
      - task: lite:docs:diagrams:generate
      - task: lite:docs:codebase-map:generate

  lite:docs:sync:
    desc: Regenerate the complete tracked Documentation Platform from canonical sources and the promoted runtime baseline, then run the strict drift/safety/MkDocs gate
    cmds:
      - task: lite:docs:generate
      - task: lite:docs:check

  lite:docs:runtime-network:check:
    desc: Verify generated docs have no external runtime repository API dependency
    deps:
      - lite:dev:scratch:prepare
    cmds:
      - '{{.PYTHON}} scripts/docs/check_docs_runtime_network_fence.py'

  lite:docs:check:
    desc: Strict combined documentation, schema, runtime, diagram, contract, safety, and MkDocs gate
    deps: [lite:dev:scratch:prepare]
    cmds:
      - task: lite:docs:tools:check
      - task: lite:contracts:check
      - task: lite:docs:platform:check
      - task: lite:docs:runtime:check
      - task: lite:docs:parity:check
      - task: lite:docs:health:check
      - task: lite:docs:knowledge:check
      - task: lite:docs:codebase-map:check
      - task: lite:docs:intelligence:check
      - task: lite:docs:enterprise:check
      - task: lite:docs:architecture:check
      - task: lite:docs:development:check
      - task: lite:docs:production:check
      - '{{.PYTHON}} scripts/docs/sqlite/generate_schemaspy.py check'
      - task: lite:docs:diagrams:check
      - task: lite:docs:backend-tests
      - '{{.PYTHON}} -m mkdocs build --strict'
      - task: lite:docs:runtime-network:check

  lite:docs:backend-tests:
    desc: Run backend Documentation Platform ownership, wiring, and architecture contract tests
    cmds:
      - 'PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 {{.PYTHON}} -m pytest -q tests/backend/test_lite_development_documentation_platform.py tests/backend/test_lite_complete_documentation_platform.py tests/backend/test_lite_production_architecture_platform.py'

  lite:test:docs:
    desc: Validate the MkDocs portal in external Chrome on desktop and mobile
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:docs

  lite:docs:serve:
    desc: Serve combined Development and Production docs locally
    deps: [lite:dev:scratch:prepare]
    cmds:
      - bash scripts/dev/lite/serve-docs.sh
