version: '3'

tasks:
  lite:storybook:
    desc: Start Lite Storybook with deterministic MSW fixtures
    cmds:
      - npm run storybook -- --host 127.0.0.1

  lite:storybook:build:
    desc: Build the Lite Storybook static site
    cmds:
      - npm run build-storybook

  lite:test:storybook:
    desc: Build Storybook and run Lite inventory plus browser interaction checks
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run build-storybook
      - '{{.PYTHON}} scripts/docs/lite/generate_docs.py check-storybook'
      - node scripts/docs/lite/test-storybook.mjs

  lite:storybook:screenshots:
    desc: Capture canonical Lite Storybook screenshots with the verified browser resolver
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - node scripts/docs/lite/capture-storybook.mjs

  lite:test:e2e:mocked:
    desc: Run mocked Lite integration tests on desktop and mobile Chromium
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:e2e:mocked

  lite:test:e2e:live:
    desc: Run read-only live integration tests against Caddy/FastAPI; requires LITE_E2E_LIVE=1
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:e2e:live

  lite:test:a11y:
    desc: Run Playwright Axe checks for every Lite tab at mobile and desktop widths
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:a11y

  lite:test:visual:
    desc: Run canonical Lite visual regression screenshots against committed baselines
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:visual

  lite:test:visual:update:
    desc: Create or deliberately refresh canonical Lite visual baselines for review
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:visual:update

  lite:test:lighthouse:
    desc: Run the existing development-PC Lighthouse PWA gate
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - bash scripts/dev/check-lighthouse.sh

  lite:test:identity:premium:unit:
    desc: Run premium Identity pure selectors and interactive component tests
    cmds:
      - npm run test:identity:premium:unit

  lite:test:identity:premium:mocked:
    desc: Run premium Identity mocked desktop/mobile, responsive and Axe AA contracts
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:identity:premium:mocked

  lite:test:identity:premium:visual:
    desc: Compare premium Identity screenshots to separately owner-reviewed baselines
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:identity:premium:visual

  lite:test:rules:premium:unit:
    desc: Run authored premium Rules selector, Journey and Insight tests
    cmds:
      - npm run test:rules:premium:unit

  lite:test:rules:premium:mocked:
    desc: Run authored Rules mocked browser, accessibility and activation tests
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:rules:premium:mocked

  lite:test:rules:premium:visual:
    desc: Run Rules visual specs against later owner-approved baselines
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:rules:premium:visual

  lite:test:rules:premium:perf:
    desc: Collect Rules interaction timing without relaxing existing budget gates
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:rules:premium:perf

  # Azure Horizon Recovery P0–P4. Author only; DO NOT RUN in this implementation session.
  lite:test:recovery:azure:unit:
    desc: Unit and presentation safety cases for Azure Recovery; deferred qualification
    cmds:
      - npm run test:recovery:azure:unit

  lite:test:recovery:azure:mocked:
    desc: Recovery mocked responsive, protected flow and operational truth cases
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:recovery:azure:mocked

  lite:test:recovery:azure:a11y:
    desc: Recovery WCAG, 200 percent enlargement and reduced motion cases
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:recovery:azure:a11y

  lite:test:recovery:azure:geometry:
    desc: Recovery desktop shared geometry and mobile non-draggable Manage contract
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:recovery:azure:geometry

  lite:test:recovery:azure:visual:
    desc: Recovery visual scenarios; baseline capture and owner approval deferred
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:recovery:azure:visual

  lite:test:recovery:azure:perf:
    desc: Recovery supplemental interaction sampling with PR 588 budgets unchanged
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:recovery:azure:perf

  lite:test:recovery:azure:storybook:
    desc: Build existing Storybook with Azure Recovery synthetic states
    cmds:
      - npm run test:recovery:azure:storybook

  lite:test:recovery:azure:qualification:
    desc: Future Codex qualification after implementing Recovery P0–P4
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:recovery:azure:qualification

  lite:test:recovery:premium:unit:
    desc: Run authored Recovery truth selectors and educational Journey component coverage
    cmds:
      - npm run test:recovery:premium:unit

  lite:test:recovery:premium:mocked:
    desc: Run Recovery mocked desktop/mobile, responsive, keyboard and Axe contracts
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:recovery:premium:mocked

  lite:test:recovery:premium:visual:
    desc: Run Recovery visual specs after owner has reviewed and accepted baseline images
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:recovery:premium:visual

  lite:test:recovery:premium:perf:
    desc: Capture Recovery component/Manage timing for comparison to existing budgets
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:recovery:premium:perf

  lite:test:azure:unit:
    desc: Run Azure Horizon appearance and shared portal unit coverage
    cmds:
      - npm run test:azure:unit

  lite:test:azure:home:
    desc: Run Azure Home state, activity and Details component tests
    cmds:
      - npm run test:azure:home

  lite:test:azure:storybook:
    desc: Build existing Lite Storybook with Azure appearance stories
    cmds:
      - npm run test:azure:storybook

  lite:test:azure:mocked:
    desc: Run Azure responsive browser interaction and theme regression
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:azure:mocked

  lite:test:azure:a11y:
    desc: Run Azure WCAG AA, text scaling and mobile regression
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:azure:a11y

  lite:test:azure:visual:
    desc: Compare Azure appearance scenarios only after manual baseline capture and approval
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:azure:visual

  lite:test:azure:perf:
    desc: Measure Azure theme and Home Details with existing PR 588 thresholds
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:azure:perf

  lite:test:azure:qualification:
    desc: Run full Azure qualification only after visual baselines are owner-approved
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:azure:qualification

  lite:test:apps:azure:unit:
    desc: Run Azure Apps catalog and shared geometry unit checks
    cmds:
      - npm run test:apps:azure:unit

  lite:test:apps:azure:mocked:
    desc: Run Azure Apps mocks, lifecycle, responsive and desktop panel interactions
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:apps:azure:mocked

  lite:test:apps:azure:a11y:
    desc: Run Azure Apps Light/Dark, Axe and keyboard checks
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:apps:azure:a11y

  lite:test:apps:azure:geometry:
    desc: Run Apps and Devices shared desktop Manage movement/regression checks
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:apps:azure:geometry

  lite:test:apps:azure:visual:
    desc: Compare Azure Apps visuals after owner-approved baseline capture
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:apps:azure:visual

  lite:test:apps:azure:perf:
    desc: Run supplemental interaction samples with PR 588 thresholds unchanged
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:apps:azure:perf

  lite:test:apps:azure:qualification:
    desc: Run Azure Apps source and browser qualification; visual separately gated
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:apps:azure:qualification

  # Premium refinement qualification is maintained by the PR #629 evidence ledger.
  lite:test:apps:premium:unit:
    desc: Run Apps P0/P1 premium unit and selector coverage
    cmds:
      - npm run test:apps:premium:unit

  lite:test:apps:premium:mocked:
    desc: Run Apps P0/P1 premium mocked desktop/mobile coverage
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:apps:premium:mocked

  lite:test:apps:premium:a11y:
    desc: Run Apps P0/P1 premium accessibility and Axe coverage
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:apps:premium:a11y

  lite:test:apps:premium:theme:
    desc: Run Apps P0/P1 premium Daylight/Black/System theme coverage
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:apps:premium:theme

  lite:test:apps:premium:geometry:
    desc: Run Apps P0/P1 premium desktop geometry coverage
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:apps:premium:geometry

  lite:test:apps:premium:devices-regression:
    desc: Run Apps P0/P1 premium shared Apps/Devices geometry regression coverage
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:apps:premium:devices-regression

  lite:test:apps:premium:visual:
    desc: Compare Apps P0/P1 premium visuals against accepted baselines
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:apps:premium:visual

  lite:test:apps:premium:performance:
    desc: Run Apps P0/P1 premium performance samples with existing budgets
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:apps:premium:performance

  lite:test:apps:premium:storybook:
    desc: Build and exercise Apps P0/P1 premium Storybook coverage
    cmds:
      - npm run test:apps:premium:storybook

  lite:test:rules:azure:unit:
    desc: Rules Azure selectors, Journey and shared geometry unit tests
    cmds:
      - npm run test:rules:azure:unit

  lite:test:rules:azure:mocked:
    desc: Azure Rules desktop/mobile mocked scenarios and protected UX
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:rules:azure:mocked

  lite:test:rules:azure:a11y:
    desc: Rules Axe, theme, text scaling and reduced motion
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:rules:azure:a11y

  lite:test:rules:azure:geometry:
    desc: Shared Rules desktop Manage movement and mobile separation
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:rules:azure:geometry

  lite:test:rules:azure:visual:
    desc: Azure Rules visuals after independent owner baseline review
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:rules:azure:visual

  lite:test:rules:azure:perf:
    desc: Supplemental Rules performance evidence with PR 588 gates unchanged
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:rules:azure:perf

  lite:test:rules:azure:qualification:
    desc: Authoritative Rules stabilization after human visual baseline approval
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:rules:azure:qualification

  lite:test:rules:azure:storybook:
    desc: Build the existing Lite Storybook including Azure Rules stories
    cmds:
      - npm run test:rules:azure:storybook

  lite:test:azure:home:premium:unit:
    desc: Authored Home navigation, activity presentation and shared geometry unit contracts
    cmds:
      - npm run test:azure:home:premium:unit

  lite:test:azure:home:premium:mocked:
    desc: Home light/dark/system panels, keyboard, desktop geometry, mobile, responsive, Axe mocked coverage
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:azure:home:premium:mocked

  lite:test:azure:home:premium:visual:
    desc: Compare Home panel screenshots only after owner review/approval of new baselines
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:azure:home:premium:visual

  lite:test:azure:home:premium:perf:
    desc: Capture premium Home interactions with PR 588 budgets unchanged
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:azure:home:premium:perf


  # Azure Horizon Devices — definitions only; never executed during source authoring.
  lite:test:devices:azure:unit:
    desc: Run Devices Azure projection, card and shared Manage geometry unit coverage
    cmds:
      - npm run test:devices:azure:unit

  lite:test:devices:azure:mocked:
    desc: Run mocked Devices connection and safe action regression
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:devices:azure:mocked

  lite:test:devices:azure:a11y:
    desc: Run Devices Azure Black/Daylight keyboard and Axe checks
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:devices:azure:a11y

  lite:test:devices:azure:geometry:
    desc: Run shared desktop Manage movement, resize and mobile fallback scenarios
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:devices:azure:geometry

  lite:test:devices:azure:visual:
    desc: Compare Devices Azure screenshots only after manual capture and owner approval
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:devices:azure:visual

  lite:test:devices:azure:perf:
    desc: Collect Devices interaction samples and retain PR 588 performance gates
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:devices:azure:perf

  lite:test:devices:azure:storybook:
    desc: Build existing Storybook with Azure Devices scenarios
    cmds:
      - npm run test:devices:azure:storybook

  lite:test:devices:azure:qualification:
    desc: Run Devices source/mock/a11y/geometry/performance; visual approval remains separate
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:devices:azure:qualification
