version: '3'

tasks:
  lite:storybook:
    desc: Start Lite Storybook with deterministic MSW fixtures
    cmds:
      - npm run storybook -- --host 127.0.0.1

  lite:storybook:build:
    desc: Build the Lite Storybook static site
    cmds:
      - npm run build-storybook

  lite:test:storybook:
    desc: Build Storybook and run Lite inventory plus browser interaction checks
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run build-storybook
      - '{{.PYTHON}} scripts/docs/lite/generate_docs.py check-storybook'
      - node scripts/docs/lite/test-storybook.mjs

  lite:storybook:screenshots:
    desc: Capture canonical Lite Storybook screenshots with the verified browser resolver
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - node scripts/docs/lite/capture-storybook.mjs

  lite:test:e2e:mocked:
    desc: Run mocked Lite integration tests on desktop and mobile Chromium
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:e2e:mocked

  lite:test:e2e:live:
    desc: Run read-only live integration tests against Caddy/FastAPI; requires LITE_E2E_LIVE=1
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:e2e:live

  lite:test:a11y:
    desc: Run Playwright Axe checks for every Lite tab at mobile and desktop widths
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:a11y

  lite:test:visual:
    desc: Run canonical Lite visual regression screenshots against committed baselines
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:visual

  lite:test:visual:update:
    desc: Create or deliberately refresh canonical Lite visual baselines for review
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:visual:update

  lite:test:lighthouse:
    desc: Run the existing development-PC Lighthouse PWA gate
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - bash scripts/dev/check-lighthouse.sh

  lite:test:identity:premium:unit:
    desc: Run premium Identity pure selectors and interactive component tests
    cmds:
      - npm run test:identity:premium:unit

  lite:test:identity:premium:mocked:
    desc: Run premium Identity mocked desktop/mobile, responsive and Axe AA contracts
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:identity:premium:mocked

  lite:test:identity:premium:visual:
    desc: Compare premium Identity screenshots to separately owner-reviewed baselines
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:identity:premium:visual

  lite:test:rules:premium:unit:
    desc: Run authored premium Rules selector, Journey and Insight tests
    cmds:
      - npm run test:rules:premium:unit

  lite:test:rules:premium:mocked:
    desc: Run authored Rules mocked browser, accessibility and activation tests
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:rules:premium:mocked

  lite:test:rules:premium:visual:
    desc: Run Rules visual specs against later owner-approved baselines
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:rules:premium:visual

  lite:test:rules:premium:perf:
    desc: Collect Rules interaction timing without relaxing existing budget gates
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:rules:premium:perf

  lite:test:recovery:premium:unit:
    desc: Run authored Recovery truth selectors and educational Journey component coverage
    cmds:
      - npm run test:recovery:premium:unit

  lite:test:recovery:premium:mocked:
    desc: Run Recovery mocked desktop/mobile, responsive, keyboard and Axe contracts
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:recovery:premium:mocked

  lite:test:recovery:premium:visual:
    desc: Run Recovery visual specs after owner has reviewed and accepted baseline images
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:recovery:premium:visual

  lite:test:recovery:premium:perf:
    desc: Capture Recovery component/Manage timing for comparison to existing budgets
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:recovery:premium:perf

  lite:test:azure:unit:
    desc: Run Azure Horizon appearance and shared portal unit coverage
    cmds:
      - npm run test:azure:unit

  lite:test:azure:home:
    desc: Run Azure Home state, activity and Details component tests
    cmds:
      - npm run test:azure:home

  lite:test:azure:storybook:
    desc: Build existing Lite Storybook with Azure appearance stories
    cmds:
      - npm run test:azure:storybook

  lite:test:azure:mocked:
    desc: Run Azure responsive browser interaction and theme regression
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:azure:mocked

  lite:test:azure:a11y:
    desc: Run Azure WCAG AA, text scaling and mobile regression
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:azure:a11y

  lite:test:azure:visual:
    desc: Compare Azure appearance scenarios only after manual baseline capture and approval
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:azure:visual

  lite:test:azure:perf:
    desc: Measure Azure theme and Home Details with existing PR 588 thresholds
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:azure:perf

  lite:test:azure:qualification:
    desc: Run full Azure qualification only after visual baselines are owner-approved
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:azure:qualification

  lite:test:apps:azure:unit:
    desc: Authored Azure Apps catalog and shared geometry unit checks (NOT RUN in implementation)
    cmds:
      - npm run test:apps:azure:unit

  lite:test:apps:azure:mocked:
    desc: Azure Apps mocks, lifecycle, responsive and desktop panel interactions (NOT RUN)
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:apps:azure:mocked

  lite:test:apps:azure:a11y:
    desc: Azure Apps Light/Dark, Axe and keyboard checks (NOT RUN)
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:apps:azure:a11y

  lite:test:apps:azure:geometry:
    desc: Apps and Devices shared desktop Manage movement/regression (NOT RUN)
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:apps:azure:geometry

  lite:test:apps:azure:visual:
    desc: Azure Apps visual comparison; owner-approved baseline capture first (NOT RUN)
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:apps:azure:visual

  lite:test:apps:azure:perf:
    desc: Supplemental interaction samples, with PR 588 existing thresholds unchanged (NOT RUN)
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:apps:azure:perf

  lite:test:apps:azure:qualification:
    desc: Future Azure Apps source and browser qualification; visual separately gated (NOT RUN)
    deps: [lite:dev:scratch:prepare, lite:playwright:preflight]
    cmds:
      - npm run test:apps:azure:qualification
