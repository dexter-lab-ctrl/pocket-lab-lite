apiVersion: pocketlab.io/v1alpha1
kind: TypedOperation
metadata:
  name: git_sync
  title: Source and Release Sync
  description: Synchronize supported release/source metadata without legacy GitOps service orchestration.
  tags:
  - release
  - source
  - sync
  - write
spec:
  professionalLabel: Sync release source
  simpleLabel: Keep my environment updated
  uiEntrypoints:
  - App Catalog
  - System Health
  - Keep My Environment Updated
  apiEntrypoints:
  - /api/operations/execute
  natsSubject: pocketlab.commands.operation.execute
  successEvents:
  - pocketlab.events.operation.succeeded
  failureEvents:
  - pocketlab.events.operation.failed
  backendOwner: release/source adapter
  targetShape:
    type: git
    ref: repo-or-branch
  paramsShape:
    branch: string
    strategy: safe-sync
  safety: Must not reintroduce retired sync shell compatibility paths.
  notes: Uses the supported release/source adapter; it does not start or proxy a legacy GitOps service.
security:
  data_classification: operational
  stride:
  - Tampering
  - Repudiation
  trust_boundaries:
  - browser_to_fastapi
  - fastapi_to_nats
  - nats_to_worker
  attack_surfaces:
  - api_endpoint
  - nats_subject
  - worker_handler
  mitigations:
  - typed_operation_schema
  - openapi_validation
  - asyncapi_subject_governance
  - operation_audit_events
  residual_risks:
  - Authorized operators can still trigger high-impact changes if policy or approval controls are incomplete.
  evidence:
  - architecture/structurizr/workspace.dsl
  - contracts/generated/openapi.json
  - contracts/asyncapi/pocketlab-nats-jetstream.yaml
  - contracts/operations/pocketlab-typed-operations.json
  - operations/git_sync.yaml
