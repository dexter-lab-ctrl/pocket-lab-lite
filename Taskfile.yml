version: '3'

vars:
  PYTHON: '{{default ".venv/bin/python" .PYTHON}}'
  LITE_API_DIRECT_URL: '{{default "http://127.0.0.1:8000" .LITE_API_DIRECT_URL}}'
  LITE_BASE_URL: '{{default "http://127.0.0.1:8443" .LITE_BASE_URL}}'
  LITE_FRONTEND_URL: '{{default "http://127.0.0.1:5173" .LITE_FRONTEND_URL}}'
  LITE_STORYBOOK_URL: '{{default "http://127.0.0.1:6006" .LITE_STORYBOOK_URL}}'
  LITE_DOCS_URL: '{{default "http://127.0.0.1:8001" .LITE_DOCS_URL}}'
  NATS_URL: '{{default "nats://127.0.0.1:4222" .NATS_URL}}'
  STATE_DIR: '{{default ".pocketlab-dev/state" .STATE_DIR}}'
  VALIDATION_DIR: '{{default ".pocketlab-dev/validation" .VALIDATION_DIR}}'

env:
  LITE_API_DIRECT_URL: '{{.LITE_API_DIRECT_URL}}'
  LITE_BASE_URL: '{{.LITE_BASE_URL}}'
  LITE_FRONTEND_URL: '{{.LITE_FRONTEND_URL}}'
  LITE_STORYBOOK_URL: '{{.LITE_STORYBOOK_URL}}'
  LITE_DOCS_URL: '{{.LITE_DOCS_URL}}'
  NATS_URL: '{{.NATS_URL}}'
  STATE_DIR: '{{.STATE_DIR}}'
  VALIDATION_DIR: '{{.VALIDATION_DIR}}'
  POCKETLAB_STATE_DIR: '{{.STATE_DIR}}'
  POCKETLAB_NATS_URL: '{{.NATS_URL}}'
  POCKETLAB_NATS_REQUIRED: '1'
  POCKETLAB_NATS_REQUIRE_JETSTREAM: '1'
  POCKETLAB_ENV: dev
  POCKETLAB_DEV_PYTHON: '{{.PYTHON}}'

includes:
  lite-core:
    taskfile: ./tasks/Taskfile.lite.yml
    flatten: true
  lite-ui:
    taskfile: ./tasks/Taskfile.ui.yml
    flatten: true
  lite-docs:
    taskfile: ./tasks/Taskfile.docs.yml
    flatten: true
  lite-release:
    taskfile: ./tasks/Taskfile.release.yml
    flatten: true
  lite-parity:
    taskfile: ./tasks/Taskfile.parity.yml
    flatten: true
  lite-windows:
    taskfile: ./tasks/Taskfile.windows.yml
    flatten: true

tasks:
  default:
    desc: List Pocket Lab Lite development tasks
    cmds:
      - task --list

  lite:
    desc: 'Compatibility alias for lite:check'
    cmds:
      - task: lite:check
